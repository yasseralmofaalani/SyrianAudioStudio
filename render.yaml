services:
  - type: web
    name: syrian-audio-studio
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MAX_FILE_SIZE_MB
        value: "80"
      - key: MAX_FILES_PER_JOB
        value: "100"
      - key: CONCURRENCY
        value: "2"
      # اختياري — أضفه من لوحة Render إن أردت إعداداً دائماً
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
